name: Build and test
on:
  workflow_dispatch:
  push:
    branches: [main, v18/main, v17/main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test publish tag validation
        run: bash .github/scripts/test-publish-tags.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/Umbraco.Community.Handbook/Client/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
      - name: Build and test client
        working-directory: src/Umbraco.Community.Handbook/Client
        run: |
          npm ci --legacy-peer-deps
          npm test
          npm run build
      - name: Test server and build demo
        run: |
          dotnet test tests/Umbraco.Community.Handbook.Tests --configuration Release
          dotnet build demo/Handbook.TestSite --configuration Debug
      - name: Pack
        run: dotnet pack src/Umbraco.Community.Handbook --configuration Release --output artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*nupkg
